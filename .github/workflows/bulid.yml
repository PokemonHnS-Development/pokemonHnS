  name: Build Full ROM
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi python3 libpng-dev wget git

      - name: Setup agbcc (Pre-compiled)
        run: |
          # הורדת גרסה שכבר נבנתה מראש כדי למנוע שגיאה 138
          git clone https://github.com
          cd agbcc
          ./install.sh ../
          cd ..

      - name: Prepare Base ROM
        run: |
          wget -O baserom.gba "https://archive.org"
          cp baserom.gba rom.gba

      - name: Build ROM
        run: |
          # בנייה מהירה
          make -j$(nproc)

      - name: Capture Output
        if: always()
        run: |
          mkdir -p output
          # חיפוש ה-GBA המוגמר
          find . -name "*.gba" -size +15M ! -name "baserom.gba" -exec cp {} ./output/PokemonHnS_Final.gba \;

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-HnS-Final-ROM
          path: output/
