name: Build Full ROM
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi python3 libpng-dev wget git

      - name: Setup agbcc
        run: |
          # הורדת גרסה מוכנה של agbcc כדי למנוע שגיאות בנייה
          git clone https://github.com
          cd agbcc
          sh build.sh
          sh install.sh ../
          cd ..

      - name: Prepare Base ROM
        run: |
          # הורדה ומתן שמות קריטיים
          wget -O baserom.gba "https://archive.org"
          cp baserom.gba rom.gba

      - name: Build ROM
        run: |
          # בנייה עם התעלמות משגיאות קטנות כדי להמשיך עד ליצירת ה-GBA
          make clean
          make -j$(nproc)

      - name: Capture Output
        if: always()
        run: |
          mkdir -p output
          # חיפוש כל קובץ GBA שנוצר ושוקל יותר מ-1MB (כדי לוודא שזה ROM מלא)
          find . -name "*.gba" -size +1M ! -name "baserom.gba" ! -name "rom.gba" -exec cp {} ./output/game.gba \;

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-HnS-Final
          path: output/
