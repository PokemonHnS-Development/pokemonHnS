name: Build Full ROM
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi python3 libpng-dev wget git

      - name: Install agbcc
        run: |
          git clone https://github.com
          cd agbcc
          ./build.sh
          ./install.sh ../
          cd ..

      - name: Get Base ROM
        run: |
          # הורדת ה-ROM ומתן כל השמות האפשריים שהפרויקט עשוי לחפש
          wget -O emerald.gba "https://archive.org"
          cp emerald.gba baserom.gba
          cp emerald.gba rom.gba

      - name: Build ROM
        run: |
          make clean
          # כאן אנחנו נותנים פקודה ליצור קובץ GBA מלא
          make -j$(nproc)
          
      - name: Rename and Move Output
        if: always()
        run: |
          mkdir -p final_output
          # פקודה שמוצאת את ה-ROM שנוצר (שאינו המקור) ומעבירה אותו
          find . -maxdepth 2 -name "*.gba" ! -name "baserom.gba" ! -name "rom.gba" ! -name "emerald.gba" -exec cp {} ./final_output/PokemonHnS_Full.gba \;

      - name: Upload Full ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-Final-Full-ROM
          path: final_output/PokemonHnS_Full.gba
