name: Ultimate Build ROM
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi python3 libpng-dev wget git

      - name: Install agbcc (The Pokemon Compiler)
        run: |
          # שלב קריטי - בלי זה הבנייה תמיד תיכשל בפרויקטים של Emerald
          git clone https://github.com
          cd agbcc
          ./build.sh
          ./install.sh ../
          cd ..

      - name: Get Base ROM
        run: |
          wget -O baserom.gba "https://archive.org"

      - name: Build ROM
        run: |
          # ניקוי ובנייה מחדש
          make clean
          make -j$(nproc)

      - name: Collect GBA File
        if: always()
        run: |
          mkdir -p final_rom
          # מחפש כל קובץ GBA שאינו ה-baserom המקורי
          find . -type f -name "*.gba" ! -name "baserom.gba" -exec cp {} ./final_rom/ \;

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Finished-Pokemon-ROM
          path: final_rom/
          
