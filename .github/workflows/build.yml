name: Build ROM Patch
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi python3
          
      - name: Build
        run: |
          # הבנייה כאן תיצור רק את השינויים (بدון ה-ROM המקורי)
          make -j$(nproc) || true 
          # אנחנו מחפשים קובץ בסיומת .gba שנוצר בתיקיית build
          
      - name: Upload Patch
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-Files
          path: build/**/*.gba
          
