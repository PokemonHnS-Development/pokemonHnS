on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # מאפשר לך להפעיל את הבנייה ידנית בכפתור

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libpng-dev pkg-config

      - name: Install devkitARM
        run: |
          wget https://github.com
          sudo apt-get install -y ./devkitpro-pacman.amd64.deb
          sudo dkp-pacman -S --noconfirm gba-dev
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "PATH=/opt/devkitpro/devkitARM/bin:$PATH" >> $GITHUB_ENV

      - name: Build ROM
        run: |
          make -j$(nproc) modern # השתמש ב-'make modern' כפי שמופיע ב-Makefile שלך

      - name: Upload ROM
        uses: actions/upload-artifact@v3
        with:
          name: built-rom
          path: pokemonHnS.gba # שם הקובץ שיוצא מה-Makefile שלך
          name: Makefile CI

