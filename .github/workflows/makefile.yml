# GitHub Actions Workflow for ROM Building

name: Build ROM

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '11'

      - name: Build ROM
        run: |
          ./gradlew build
          # Add your build commands here